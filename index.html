<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>じぶんドリル</title>
<meta name="description" content="学年を えらんで、自分の問題も作れる 家庭学習ドリル（手書き・自動まるつけ）">
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#f6f2e9">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="じぶんドリル">
<link rel="apple-touch-icon" href="./icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Zen+Maru+Gothic:wght@400;500;700&family=Klee+One:wght@400;600&display=swap">

<style>
  html{color-scheme:light dark}
  body{margin:0}
  [hidden]{display:none !important}
  img{max-width:100%}
  :root{
    --paper:#ffffff; --ground:#f2eee4;
    --ink:#23211d; --ink-soft:#6f695d; --ink-faint:#9c9587;
    --rule:#ded7c6; --rule-soft:#ece6d8;
    --shu:#d4453a; --shu-ink:#c0392f; --shu-wash:#fbeeec;
    --ok-wash:#f0f4ec; --ok-ink:#3f7a52;
    --bar:#2e2b25; --bar-ink:#f3efe4;
    --field:#fdfcf8; --field-line:#c8c0ad; --grid:#e4ddcc;
    --a1:#d4453a; --a1w:#fdeeec; --a2:#4d8fd6; --a2w:#eaf2fb; --a3:#5aa86b; --a3w:#ecf5ed;
    --f-round:'Zen Maru Gothic','Hiragino Maru Gothic ProN','Hiragino Sans','Yu Gothic',sans-serif;
    --f-kaku:'Zen Kaku Gothic New','Hiragino Sans','Yu Gothic',sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#27241f; --ground:#1a1815; --ink:#efeade; --ink-soft:#a9a293; --ink-faint:#7d7768;
      --rule:#403b32; --rule-soft:#332f28; --shu:#ef6b60; --shu-ink:#f08076; --shu-wash:#3a2723;
      --ok-wash:#22301f; --ok-ink:#8fc79f; --bar:#efeade; --bar-ink:#23211d;
      --field:#201e19; --field-line:#4d4739; --grid:#3a3529;
      --a1:#ef6b60; --a1w:#3a2723; --a2:#7bb0e8; --a2w:#1f2a35; --a3:#8fc79f; --a3w:#1f2b22;
    }
  }
  :root[data-theme="dark"]{
    --paper:#27241f; --ground:#1a1815; --ink:#efeade; --ink-soft:#a9a293; --ink-faint:#7d7768;
    --rule:#403b32; --rule-soft:#332f28; --shu:#ef6b60; --shu-ink:#f08076; --shu-wash:#3a2723;
    --ok-wash:#22301f; --ok-ink:#8fc79f; --bar:#efeade; --bar-ink:#23211d;
    --field:#201e19; --field-line:#4d4739; --grid:#3a3529;
    --a1:#ef6b60; --a1w:#3a2723; --a2:#7bb0e8; --a2w:#1f2a35; --a3:#8fc79f; --a3w:#1f2b22;
  }

  *{box-sizing:border-box}
  body{
    background:var(--ground); color:var(--ink);
    font-family:var(--f-kaku); line-height:1.7;
    margin:0; padding:0 0 108px;
    -webkit-text-size-adjust:100%;
  }
  button, input{font:inherit; color:inherit; touch-action:manipulation}
  button{cursor:pointer}
  :focus-visible{outline:3px solid var(--shu); outline-offset:2px}
  .wrap{max-width:760px; margin:0 auto; padding:0 14px}
  @media (min-width:900px){ .wrap{max-width:920px} }
  .linkbtn{background:none; border:0; padding:6px 10px; font:inherit; font-size:13px; color:var(--ink-soft); text-decoration:underline; cursor:pointer}
  .linkbtn.shu{color:var(--shu-ink)}
  h2.sec{font-family:var(--f-round); font-size:18px; font-weight:700; margin:22px 0 10px}
  h2.sec small{font-family:var(--f-kaku); font-size:12px; font-weight:500; color:var(--ink-soft); margin-left:8px}
  .muted{color:var(--ink-soft); font-size:13px}

  /* ---------- header ---------- */
  .top{background:var(--bar); color:var(--bar-ink); padding:12px 0 10px; position:sticky; top:0; z-index:20}
  .top .wrap{display:flex; align-items:center; gap:12px; flex-wrap:wrap}
  .top h1{font-family:var(--f-round); font-size:18px; font-weight:700; margin:0; letter-spacing:.04em}
  .back{
    font-family:var(--f-round); font-size:15px; font-weight:700; color:var(--bar-ink);
    background:transparent; border:1.5px solid currentColor; border-radius:999px; padding:5px 14px 5px 10px; min-height:38px; opacity:.85;
  }
  .tabs{display:flex; gap:6px; margin-left:auto}
  .tab{
    font-family:var(--f-round); font-size:15px; font-weight:500;
    background:transparent; color:var(--bar-ink); opacity:.62;
    border:1.5px solid currentColor; border-radius:999px; padding:6px 14px; min-height:38px;
  }
  .tab[aria-pressed="true"]{opacity:1; background:var(--shu); border-color:var(--shu); color:#fff}
  .tabs.inpage .tab{color:var(--ink); opacity:.75}
  .tabs.inpage .tab[aria-pressed="true"]{color:#fff; opacity:1}

  /* ---------- home ---------- */
  .hello{font-family:var(--f-round); font-size:15px; color:var(--ink-soft); margin:18px 0 12px}
  .hello b{color:var(--ink); font-size:17px}
  .tiles{display:grid; grid-template-columns:repeat(auto-fit, minmax(215px, 1fr)); gap:12px}
  .tile{
    display:flex; flex-direction:column; align-items:flex-start; gap:9px;
    min-height:128px; padding:16px 16px 14px; border-radius:16px; text-align:left;
    background:var(--paper); border:1.5px solid var(--rule); color:var(--ink);
  }
  .tile svg{width:34px; height:34px; color:var(--shu-ink)}
  .tile b{font-family:var(--f-round); font-size:20px; font-weight:700; line-height:1.3}
  .tile span{font-size:13px; color:var(--ink-soft); line-height:1.5}
  .tile.primary{background:var(--shu); border-color:var(--shu); color:#fff}
  .tile.primary svg, .tile.primary span{color:rgba(255,255,255,.88)}
  .tile .badge{display:inline-block; margin-top:auto; font-size:12px; color:var(--shu-ink); font-weight:700}

  /* ---------- sheet picker ---------- */
  .pick{background:var(--paper); border-bottom:1px solid var(--rule)}
  .pick .wrap{padding-top:10px; padding-bottom:10px}
  .pick-row{display:flex; gap:7px; overflow-x:auto; padding-bottom:4px; scrollbar-width:thin}
  .chip{
    flex:none; width:56px; height:56px; border-radius:12px;
    border:1.5px solid var(--rule); background:var(--field);
    font-family:var(--f-round); font-size:15px; font-weight:700;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px;
  }
  .chip small{font-family:var(--f-kaku); font-size:10px; font-weight:500; color:var(--ink-faint); line-height:1}
  .chip.done small{color:var(--ok-ink)}
  .chip.full{border-color:var(--ok-ink)}
  .chip[aria-pressed="true"]{background:var(--shu); border-color:var(--shu); color:#fff}
  .chip[aria-pressed="true"] small{color:rgba(255,255,255,.85)}

  /* ---------- problems ---------- */
  .sheet-hd{display:flex; align-items:baseline; gap:10px; margin:18px 0 10px; font-family:var(--f-round)}
  .sheet-hd h2{font-size:19px; font-weight:700; margin:0}
  .sheet-hd span{font-size:13px; color:var(--ink-soft); font-family:var(--f-kaku)}
  .q{background:var(--paper); border:1px solid var(--rule); border-radius:12px; padding:14px 15px 15px; margin-bottom:12px; position:relative}
  .q-hd{display:flex; align-items:flex-start; gap:9px}
  .q-n{
    flex:none; width:30px; height:30px; border-radius:50%; border:2px solid var(--shu); color:var(--shu-ink);
    font-family:var(--f-round); font-weight:700; font-size:15px; display:flex; align-items:center; justify-content:center; line-height:1;
  }
  .q-t{font-family:var(--f-round); font-size:16.5px; line-height:1.85; line-break:strict; flex:1; margin:0}
  .q-type{position:absolute; top:-9px; left:14px; font-size:11px; color:var(--ink-soft); background:var(--paper); padding:0 6px; border-radius:6px}
  .row{display:flex; align-items:center; flex-wrap:wrap; gap:8px; margin:13px 0 0 39px}
  .row .lbl{font-family:var(--f-round); font-size:15px; color:var(--ink-soft); flex:none}
  .num{width:96px; height:52px; text-align:center; font-family:var(--f-round); font-size:22px; font-weight:700; background:var(--field); border:2px solid var(--field-line); border-radius:10px}
  .num::placeholder{color:var(--ink-faint); font-weight:400; font-size:16px}
  .unit{font-family:var(--f-round); font-size:17px; font-weight:500}
  .opts{display:flex; gap:8px; flex-wrap:wrap}
  .opt{font-family:var(--f-round); font-size:16px; font-weight:500; min-height:52px; padding:8px 16px; border-radius:10px; border:2px solid var(--field-line); background:var(--field)}
  .opt[aria-pressed="true"]{background:var(--shu); border-color:var(--shu); color:#fff}

  /* ---------- handwriting pad ---------- */
  .pad{margin:12px 0 0; border:1.5px dashed var(--field-line); border-radius:10px; overflow:hidden; background:var(--field)}
  .pad-bar{display:flex; align-items:center; gap:6px; padding:6px 8px; border-bottom:1px dashed var(--rule); flex-wrap:wrap}
  .tool{min-height:38px; padding:4px 13px; border-radius:8px; font-size:14px; font-family:var(--f-round); border:1.5px solid var(--field-line); background:var(--paper); color:var(--ink)}
  .tool[aria-pressed="true"]{background:var(--ink); color:var(--paper); border-color:var(--ink)}
  .sizes{display:inline-flex; gap:4px; margin-left:4px}
  .tool.sz{width:44px; padding:0; display:inline-flex; align-items:center; justify-content:center}
  .tool.sz i{display:block; border-radius:50%; background:currentColor}
  .sizes.era .tool.sz i{border-radius:3px; background:none; border:2px solid currentColor}
  .tool.clear{color:var(--shu-ink); margin-left:auto}
  .pad-area{position:relative; height:400px}
  .pad-guide{position:absolute; inset:0; display:flex; gap:12px; padding:10px 12px 12px; pointer-events:none}
  .g-left{flex:1 1 54%; display:flex; flex-direction:column; min-width:0; gap:6px}
  .g-line{flex:1.35; position:relative; border-bottom:1.5px solid var(--field-line)}
  .g-line.ans{flex:1; border-bottom-width:2px; border-bottom-color:var(--ink-faint)}
  .g-line span{position:absolute; left:3px; bottom:4px; font-family:var(--f-round); font-size:14px; color:var(--ink-faint); line-height:1}
  .g-right{
    flex:0 0 44%; position:relative; border:1.5px dashed var(--field-line); border-radius:6px;
    background-image:linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size:40px 40px; background-position:-1px -1px;
  }
  .g-right span{position:absolute; top:3px; left:7px; font-family:var(--f-round); font-size:13px; color:var(--ink-faint); background:var(--field); padding:0 4px; line-height:1.3}
  .pad-cv{position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:pan-y; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none}
  .pad.finger{border:2.5px solid var(--shu); background:var(--shu-wash)}
  .pad.finger .pad-cv{touch-action:none}
  .pad.finger .pad-bar{border-bottom-color:var(--shu); background:var(--paper)}
  .pad-state{font-family:var(--f-round); font-size:12.5px; color:var(--ink-faint); margin-right:auto; padding-left:2px; line-height:1.3}
  .pad.finger .pad-state{color:var(--shu-ink); font-weight:700}
  .tool.finger{border-color:var(--shu); color:var(--shu-ink)}
  .tool.finger[aria-pressed="true"]{background:var(--shu); border-color:var(--shu); color:#fff}
  @media (min-width:900px){ .pad-area{height:460px} }
  @media (max-width:560px){ .pad-area{height:620px} .pad-guide{flex-direction:column; gap:10px} .g-right{flex:0 0 300px} .g-left{flex:1 1 auto} }

  /* ---------- marking ---------- */
  .q.ok{border-color:var(--ok-ink)}
  .q.ng{border-color:var(--shu); background:var(--shu-wash)}
  .mark{position:absolute; top:10px; right:12px; font-size:34px; line-height:1; font-weight:700}
  .mark.o{width:32px; height:32px; border:4px solid var(--ok-ink); border-radius:50%; top:12px}
  .mark.x{color:var(--shu-ink)}
  .q.graded .num, .q.graded .opt{pointer-events:none}
  .q.ng .num, .q.ng .opt{border-color:var(--shu); opacity:.75}
  .fix{margin:12px 0 0 39px; padding:11px 13px; border-radius:9px; background:var(--paper); border:1px dashed var(--shu); font-family:var(--f-round); font-size:15px; line-height:1.8}
  .fix .k{color:var(--ink-soft); font-size:13px; font-family:var(--f-kaku); margin-right:6px}
  .fix .a{color:var(--shu-ink); font-weight:700; font-size:17px}
  .fix .st{display:block; margin-top:4px; color:var(--ink-soft); font-size:14px}
  .fix .st em{font-style:normal; color:var(--ink); font-weight:500}
  .fix .go{display:block; margin-top:6px}

  /* ---------- result + action bar ---------- */
  .score{background:var(--paper); border:1px solid var(--rule); border-radius:12px; padding:14px 16px; margin-bottom:12px; display:flex; align-items:center; gap:14px; flex-wrap:wrap}
  .score .big{font-family:var(--f-round); font-size:30px; font-weight:700; line-height:1}
  .score .big i{font-style:normal; font-size:17px; color:var(--ink-soft)}
  .score .msg{font-family:var(--f-round); font-size:16px; flex:1; min-width:140px}
  .score.all .big{color:var(--ok-ink)}
  .bar{position:fixed; left:0; right:0; bottom:0; z-index:30; background:var(--paper); border-top:1px solid var(--rule); padding:10px 14px calc(10px + env(safe-area-inset-bottom))}
  .bar .wrap{display:flex; gap:10px; padding:0}
  .btn{flex:1; min-height:56px; border-radius:12px; border:2px solid var(--shu); background:var(--shu); color:#fff; font-family:var(--f-round); font-size:19px; font-weight:700}
  .btn.ghost{background:transparent; color:var(--shu-ink)}
  .btn.sm{flex:none; min-height:48px; font-size:16px; padding:0 18px}
  .btn[disabled]{opacity:.4}
  .note{font-size:12px; color:var(--ink-faint); text-align:center; margin:18px 0 6px}

  /* ---------- weak mode ---------- */
  .panel{background:var(--paper); border:1px solid var(--rule); border-radius:12px; padding:16px 18px; margin:16px 0 12px}
  .panel h3{font-family:var(--f-round); font-size:17px; margin:0 0 8px}
  .klist{display:flex; flex-direction:column; gap:6px; margin:6px 0 12px}
  .krow{display:flex; align-items:center; gap:10px; font-family:var(--f-round); font-size:16px}
  .krow .rate{margin-left:auto; font-family:var(--f-kaku); font-size:13px; color:var(--ink-soft); white-space:nowrap}
  .krow .rate.weak{color:var(--shu-ink); font-weight:700}
  .dots{display:flex; gap:6px; margin:6px 0 10px}
  .dots i{width:14px; height:14px; border-radius:50%; background:var(--rule-soft); border:1.5px solid var(--rule)}
  .dots i.some{background:var(--rule)}
  .dots i.good{background:var(--ok-ink); border-color:var(--ok-ink)}
  .dots i.weak{background:var(--shu); border-color:var(--shu)}
  .pill{display:inline-block; font-size:11px; font-weight:700; color:var(--shu-ink); border:1.5px solid var(--shu); border-radius:999px; padding:0 8px; line-height:18px}

  /* ---------- lessons ---------- */
  .llist{display:flex; flex-direction:column; gap:8px; margin-top:12px}
  .lrow{display:flex; align-items:center; gap:12px; padding:13px 16px; background:var(--paper); border:1px solid var(--rule); border-radius:12px; text-align:left; font-family:var(--f-round); font-size:17px; font-weight:700; color:var(--ink)}
  .lrow .n{flex:none; width:28px; height:28px; border-radius:50%; background:var(--shu-wash); color:var(--shu-ink); font-size:13px; display:flex; align-items:center; justify-content:center}
  .lrow .st{margin-left:auto; font-family:var(--f-kaku); font-size:12px; font-weight:500; color:var(--ink-soft); white-space:nowrap}
  .lrow .st.weak{color:var(--shu-ink); font-weight:700}
  .lesson h2{font-family:var(--f-round); font-size:21px; margin:18px 0 6px; text-wrap:balance}
  .lesson .eyebrow{display:inline-block; font-family:var(--f-round); font-size:12px; font-weight:700; color:var(--shu-ink); border:1.5px solid var(--shu); border-radius:3px; padding:1px 8px; letter-spacing:.06em; margin-top:16px}
  .lesson .why{font-family:var(--f-round); font-size:16.5px; line-height:1.9; line-break:strict; margin:6px 0 0}
  .lesson .ex{margin:14px 0 0; background:var(--shu-wash); border:1px solid rgba(212,69,58,.35); border-radius:10px; padding:12px 16px; font-family:var(--f-round); font-size:16px; line-height:2}
  .lesson .ex .h{font-size:12px; color:var(--shu-ink); font-weight:700; letter-spacing:.06em; margin-bottom:2px; font-family:var(--f-kaku)}
  .lesson .ex em{font-style:normal; color:var(--shu-ink); font-weight:700}
  .lesson .ng{margin:12px 0 0; font-family:var(--f-round); font-size:15px; color:var(--ink-soft); line-height:1.8}
  .lesson .ng b{color:var(--shu-ink)}
  .lesson .try{margin-top:22px}
  .lesson .actions{display:flex; gap:10px; flex-wrap:wrap; margin:14px 0 0}

  /* ---------- records ---------- */
  .stats{display:grid; grid-template-columns:repeat(3, 1fr); gap:10px; margin-top:14px}
  .stat{background:var(--paper); border:1px solid var(--rule); border-radius:12px; padding:12px 14px}
  .stat b{display:block; font-family:var(--f-round); font-size:26px; line-height:1.2}
  .stat b i{font-style:normal; font-size:14px; color:var(--ink-soft); font-weight:500}
  .stat span{font-size:12px; color:var(--ink-soft)}
  .trow{display:grid; grid-template-columns:1fr auto; gap:3px 12px; align-items:center; padding:10px 0; border-bottom:1px solid var(--rule-soft); width:100%; background:none; border-left:0; border-right:0; border-top:0; text-align:left; color:var(--ink)}
  .trow .nm{font-family:var(--f-round); font-size:16px; font-weight:700}
  .trow .nm .pill{margin-left:8px; vertical-align:2px}
  .trow .rt{font-size:13px; color:var(--ink-soft); white-space:nowrap; font-variant-numeric:tabular-nums}
  .bar-bg{grid-column:1 / -1; height:8px; background:var(--rule-soft); border-radius:4px; overflow:hidden}
  .bar-fg{height:100%; background:var(--ok-ink); border-radius:4px}
  .bar-fg.weak{background:var(--shu)}
  .day{margin-top:14px}
  .day h4{font-family:var(--f-round); font-size:14px; color:var(--ink-soft); margin:0 0 4px; font-weight:700}
  .lg{display:flex; align-items:center; gap:10px; padding:7px 0; border-bottom:1px solid var(--rule-soft); font-size:14px}
  .lg .tm{color:var(--ink-faint); font-variant-numeric:tabular-nums; width:44px}
  .lg .wh{font-family:var(--f-round); font-weight:700}
  .lg .sc{margin-left:auto; font-family:var(--f-round); font-weight:700; font-variant-numeric:tabular-nums}
  .lg .sc.all{color:var(--ok-ink)}
  .lg .wr{font-size:12px; color:var(--shu-ink)}
  .grid5{display:grid; grid-template-columns:repeat(5, 1fr); gap:6px; margin:6px 0 10px}
  .cell{border:1.5px solid var(--rule); border-radius:10px; padding:6px 4px; text-align:center; font-family:var(--f-round); font-size:13px; background:var(--field)}
  .cell b{display:block; font-size:15px}
  .cell.full{border-color:var(--ok-ink); color:var(--ok-ink)}
  .cell.none{color:var(--ink-faint)}
  .rec-actions{display:flex; gap:12px; justify-content:center; margin:22px 0 10px; flex-wrap:wrap}

  /* ---------- print view ---------- */
  .pctl .opt-row{display:flex; align-items:center; gap:10px 16px; flex-wrap:wrap; margin:12px 0}
  .pctl label{display:inline-flex; align-items:center; gap:8px; font-family:var(--f-round); font-size:15px}
  .pctl input[type=checkbox]{width:22px; height:22px; accent-color:var(--shu)}
  .pctl .src{display:flex; gap:8px; flex-wrap:wrap}
  .pdfs{margin:16px 0 20px}
  .pdfs .rowp{display:flex; align-items:center; gap:8px; flex-wrap:wrap; padding:8px 0; border-bottom:1px solid var(--rule-soft)}
  .pdfs .rowp b{font-family:var(--f-round); width:56px}
  .pdfs a{font-family:var(--f-round); font-size:14px; color:var(--shu-ink); border:1.5px solid var(--shu); border-radius:999px; padding:4px 12px; text-decoration:none; min-height:36px; display:inline-flex; align-items:center}
  #printArea{margin:14px auto 0; width:210mm; max-width:100%}
  .psheet{
    position:relative; width:210mm; min-height:297mm; padding:13mm 15mm 12mm; margin:0 0 8mm;
    background:#fff; color:#23211d; box-shadow:0 1px 2px rgba(35,33,29,.1), 0 10px 26px rgba(35,33,29,.13);
    font-size:10pt; font-family:var(--f-kaku); line-height:1.7;
  }
  .psheet .head{display:flex; align-items:flex-end; gap:10mm; border-bottom:1.6pt solid #23211d; padding-bottom:2.2mm}
  .psheet .ttl{font-family:var(--f-round); font-weight:700; font-size:14pt; letter-spacing:.06em; margin:0; color:#23211d}
  .psheet .no{margin-left:auto; font-family:var(--f-round); font-weight:700; font-size:11pt; color:#c0392f; border:1.4pt solid #d4453a; border-radius:2px; padding:.6mm 2.6mm; letter-spacing:.08em; white-space:nowrap}
  .psheet .meta{display:flex; align-items:baseline; gap:7mm; margin-top:3mm; font-size:9pt; color:#6f695d}
  .psheet .fill{border-bottom:.8pt solid #cfc8b8; display:inline-block}
  .psheet .d{width:9mm} .psheet .nm{flex:1; min-width:40mm}
  .psheet .sc{border:.9pt solid #cfc8b8; padding:1mm 3mm; white-space:nowrap}
  .psheet .probs{display:flex; flex-direction:column; gap:3mm; margin-top:4mm}
  .psheet .p{display:grid; grid-template-columns:1fr 62mm; grid-template-rows:auto auto; column-gap:5mm; row-gap:2mm}
  .psheet .pt{grid-column:1; grid-row:1; display:flex; gap:2.6mm; align-items:flex-start; font-family:var(--f-round); font-size:10pt; line-height:1.62; line-break:strict; text-align:justify}
  .psheet .pn{font-weight:700; font-size:11pt; color:#c0392f; flex:none; line-height:1.6}
  .psheet .lines{grid-column:1; grid-row:2; padding-left:6.6mm; display:flex; flex-direction:column; justify-content:space-between; gap:2.5mm}
  .psheet .ln{display:flex; align-items:flex-end; gap:2mm; min-height:9mm}
  .psheet .ln .lbl{font-family:var(--f-round); font-size:10pt; color:#6f695d; flex:none; white-space:nowrap}
  .psheet .ln .rule{flex:1; border-bottom:1pt solid #cfc8b8; min-height:8.5mm}
  .psheet .ln.ans .lbl{color:#23211d}
  .psheet .ln.ans .rule{border-bottom-width:1.4pt; border-bottom-color:#9c9587}
  .psheet .hs{grid-column:2; grid-row:1 / 3; border:1pt dashed #cfc8b8; position:relative; min-height:34mm; padding:3.4mm 2mm 2mm}
  .psheet .hs span{position:absolute; top:.8mm; left:1.6mm; font-family:var(--f-round); font-size:8pt; color:#9c9587}
  .psheet .akey{display:grid; grid-template-columns:1fr 1fr; gap:6mm 8mm; margin-top:6mm}
  .psheet .ak{border:.9pt solid #e7e1d3}
  .psheet > .ak{margin-top:6mm}
  .psheet .ak h4{font-family:var(--f-round); font-weight:700; font-size:10pt; margin:0; background:#fbeeec; color:#c0392f; padding:1.4mm 3mm; border-bottom:.9pt solid #eed6d2}
  .psheet .ak table{width:100%; border-collapse:collapse; font-size:9.5pt; font-variant-numeric:tabular-nums}
  .psheet .ak td{padding:1.8mm 3mm; vertical-align:top; border-top:.6pt solid #e7e1d3}
  .psheet .ak tr:first-child td{border-top:0}
  .psheet .ak .cn{width:5mm; color:#c0392f; font-weight:700; font-family:var(--f-round)}
  .psheet .ak .cs{color:#6f695d}
  .psheet .ak .ca{font-family:var(--f-round); font-weight:700; text-align:right; white-space:nowrap}
  .psheet .ak .cb{padding:1.4mm 3mm}
  .psheet .ak .cb .ca{display:block; text-align:left; font-size:9.5pt; line-height:1.4}
  .psheet .ak .cb .cs{display:block; font-size:7.8pt; line-height:1.4; margin-top:.3mm}

  /* ---------- game: character / stamps / medals ---------- */
  .ccard{display:flex; align-items:center; gap:14px; margin:16px 0 6px; padding:12px 16px 12px 12px; border-radius:16px; background:var(--paper); border:1.5px solid var(--rule); text-align:left; width:100%; color:var(--ink)}
  .ccard .char{width:92px; height:92px; flex:none}
  .ccard.room{flex-direction:column; align-items:stretch; gap:10px; padding:10px}
  .clabel{display:flex; justify-content:space-between; align-items:baseline; gap:8px; padding:2px 4px 0}
  .clabel b{font-family:var(--f-round); font-size:16px; font-weight:700}
  .clabel span{font-size:12px; color:var(--shu-ink); font-weight:700; flex:none}
  .room{display:block; width:100%; height:auto; border-radius:10px}
  .roomwrap{margin:8px 0 4px; border-radius:12px; overflow:hidden; border:1.5px solid var(--rule)}
  .ccard .goal, .gbig .goal, .panel .goal{font-family:var(--f-round); font-size:14px; color:var(--ink-soft); margin-top:4px}
  .glines{list-style:none; padding:0; margin:6px 0 0; width:100%; columns:2; column-gap:18px; font-size:13px; color:var(--ink-soft)}
  .glines li{display:flex; justify-content:space-between; gap:8px; break-inside:avoid; padding:2px 0; border-bottom:1px dashed var(--rule-soft)}
  .glines b{color:var(--ok-ink); font-variant-numeric:tabular-nums}
  .gtags{display:flex; flex-wrap:wrap; gap:6px; width:100%}
  .stp{display:flex; align-items:center; gap:10px; margin:8px 0}
  .stp{flex-wrap:wrap}
  .stp .lbl{font-family:var(--f-round); width:152px; flex:none}
  .stp b{font-family:var(--f-round); font-size:18px; min-width:64px; text-align:center}
  .medal .mate{width:64px; height:64px; margin:0 auto 4px}
  .medal .mate .char{width:64px; height:64px}
  .ccard .cinfo{flex:1; min-width:0}
  .ccard .cname{font-family:var(--f-round); font-size:18px; font-weight:700}
  .ccard .cname small{font-family:var(--f-kaku); font-size:12px; color:var(--shu-ink); margin-left:8px; font-weight:700}
  .ccard .bubble{font-family:var(--f-round); font-size:14px; color:var(--ink-soft); margin:2px 0 6px}
  .xpbar{height:10px; border-radius:5px; background:var(--rule-soft); overflow:hidden}
  .xpbar i{display:block; height:100%; background:var(--shu); border-radius:5px; transition:width .6s ease}
  .xptxt{font-size:12px; color:var(--ink-faint); margin-top:3px; font-variant-numeric:tabular-nums; display:flex; justify-content:space-between}
  .xptxt b{color:var(--ok-ink)}
  .char{overflow:visible; transform-origin:50% 100%; animation:breathe 3.2s ease-in-out infinite}
  .char .eye{transform-box:fill-box; transform-origin:center; animation:blink 4.5s infinite}
  @keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(.985,1.03)}}
  @keyframes blink{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}

  .gres{margin:0 0 12px; padding:12px 16px; border-radius:12px; background:var(--paper); border:1px solid var(--rule); display:flex; align-items:center; gap:14px; flex-wrap:wrap}
  .gres .char{width:64px; height:64px; flex:none}
  .gres .gx{font-family:var(--f-round); font-size:17px; font-weight:700}
  .gres .gx small{display:block; font-family:var(--f-kaku); font-size:12.5px; color:var(--ink-soft); font-weight:500}
  .gres .badge{display:inline-flex; align-items:center; gap:6px; background:var(--shu-wash); color:var(--shu-ink); border-radius:999px; padding:3px 12px 3px 6px; font-family:var(--f-round); font-size:13px; font-weight:700}
  .gres.up{background:linear-gradient(135deg, var(--shu-wash), var(--paper)); border-color:var(--shu); position:relative; overflow:hidden}
  .gres.up .gx{color:var(--shu-ink); font-size:20px}
  .confetti{position:absolute; top:-10px; width:8px; height:12px; border-radius:2px; opacity:.9; animation:fall 1.8s ease-in forwards}
  @keyframes fall{to{transform:translateY(140px) rotate(300deg); opacity:0}}
  .toast{position:fixed; left:50%; bottom:calc(96px + env(safe-area-inset-bottom)); transform:translateX(-50%); z-index:40; background:var(--ink); color:var(--paper); font-family:var(--f-round); font-size:15px; padding:10px 18px; border-radius:999px; box-shadow:0 6px 20px rgba(0,0,0,.25); max-width:90vw}

  .gbig{display:flex; flex-direction:column; align-items:center; text-align:center; padding:8px 0 4px}
  .gbig .char{width:180px; height:180px}
  .gbig .bubble{font-family:var(--f-round); font-size:15px; background:var(--paper); border:1.5px solid var(--rule); border-radius:14px; padding:8px 14px; margin-bottom:8px; position:relative}
  .gbig .bubble::after{content:''; position:absolute; left:50%; bottom:-8px; width:12px; height:12px; background:var(--paper); border-right:1.5px solid var(--rule); border-bottom:1.5px solid var(--rule); transform:translateX(-50%) rotate(45deg)}
  .gbig .cname{font-family:var(--f-round); font-size:22px; font-weight:700; margin-top:8px}
  .gbig .stage{font-size:13px; color:var(--ink-soft)}
  .swatches{display:flex; gap:10px; flex-wrap:wrap}
  .sw{width:40px; height:40px; border-radius:50%; border:3px solid transparent; padding:0}
  .sw[aria-pressed="true"]{border-color:var(--ink)}
  .accs{display:grid; grid-template-columns:repeat(auto-fill, minmax(120px,1fr)); gap:8px}
  .acc{border:1.5px solid var(--rule); border-radius:12px; padding:10px 8px; text-align:center; background:var(--paper); font-family:var(--f-round); font-size:14px; color:var(--ink)}
  .acc[aria-pressed="true"]{border-color:var(--shu); background:var(--shu-wash)}
  .acc.lock{opacity:.55}
  .acc small{display:block; font-family:var(--f-kaku); font-size:11px; color:var(--ink-soft); margin-top:2px}
  .card{display:grid; grid-template-columns:repeat(6, 1fr); gap:8px; margin:8px 0 4px; max-width:470px}
  .slot{aspect-ratio:1; border-radius:50%; border:2px dashed var(--rule); display:flex; align-items:center; justify-content:center; font-family:var(--f-round); font-size:11px; color:var(--ink-faint); background:var(--field)}
  .slot.on{border:2.5px solid var(--shu); color:var(--shu-ink); font-weight:700; font-size:13px; background:var(--shu-wash); transform:rotate(-8deg); box-shadow:inset 0 0 0 2px var(--paper)}
  .medals{display:grid; grid-template-columns:repeat(auto-fill, minmax(150px,1fr)); gap:10px}
  .medal{border:1.5px solid var(--rule); border-radius:12px; padding:12px 10px; text-align:center; background:var(--paper)}
  .medal .ic{width:52px; height:52px; border-radius:50%; margin:0 auto 6px; display:flex; align-items:center; justify-content:center; font-size:26px; background:var(--shu-wash); border:2.5px solid var(--shu)}
  .medal b{font-family:var(--f-round); font-size:14px; display:block}
  .medal small{font-size:11px; color:var(--ink-soft); display:block; line-height:1.5}
  .medal.lock .ic{background:var(--rule-soft); border-color:var(--rule); filter:grayscale(1); opacity:.6}
  .medal.lock{opacity:.75}
  .streak{font-family:var(--f-round); font-size:15px; margin:4px 0 0}
  .streak b{color:var(--shu-ink); font-size:20px}

  /* ---------- kanji ---------- */
  .hl{color:var(--shu-ink); font-weight:700; border-bottom:2.5px solid var(--shu)}
  .kq{display:block; font-size:14px; color:var(--ink-soft); margin-top:6px; font-family:var(--f-kaku)}
  .kbig{display:block; font-family:'Klee One','Klee','Hiragino Mincho ProN',serif; font-size:64px; line-height:1.15; font-weight:600}
  .kread{display:block; font-size:15px; color:var(--ink-soft)}
  .kex{display:block; font-size:15px; margin-top:4px}
  .kdetail{text-align:center} .kdetail .kbig{font-size:96px} .kdetail .kex{font-family:var(--f-round); font-size:16px; text-align:left; margin:8px 0 0}
  .ktiles{display:grid; grid-template-columns:repeat(5, 1fr); gap:8px; margin:6px 0 10px}
  .ktile{border:1.5px solid var(--rule); border-radius:12px; background:var(--field); padding:8px 4px 6px; display:flex; flex-direction:column; align-items:center; gap:2px; color:var(--ink)}
  .ktile .kt{font-family:'Klee One','Klee','Hiragino Mincho ProN',serif; font-size:34px; line-height:1.1; font-weight:600}
  .ktile .kt-y{font-size:10.5px; color:var(--ink-soft); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%}
  .ktile.ok{border-color:var(--ok-ink); background:var(--ok-wash)} .ktile.ng{border-color:var(--shu); background:var(--shu-wash)}
  .opt.big{font-family:'Klee One','Klee','Hiragino Mincho ProN',serif; font-size:22px; font-weight:600; min-width:80px}
  .opt.o[aria-pressed="true"]{background:var(--ok-ink); border-color:var(--ok-ink); color:#fff}
  .opt.x[aria-pressed="true"]{background:var(--shu); border-color:var(--shu); color:#fff}
  .reveal{width:100%; text-align:center; padding:8px 0}
  .pad-area.kanji{height:auto; min-height:110px}
  .pad-guide.kg{position:static; display:flex; gap:10px; padding:10px; justify-content:center}
  .ksq{position:relative; width:min(150px, calc((100% - 30px) / 4)); aspect-ratio:1; border:1.5px solid var(--field-line); background-color:var(--field);
    background-image:linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px); background-size:50% 50%; background-position:-1px -1px}
  .ksq .model{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-family:'Klee One','Klee','Hiragino Mincho ProN',serif; font-size:clamp(40px, 15vw, 108px); line-height:1; color:var(--ink); pointer-events:none}
  .ksq .model.trace{opacity:.35} .ksq .model.faint{opacity:.16}
  @media (max-width:560px){ .ktiles{grid-template-columns:repeat(5, 1fr)} .ktile .kt{font-size:26px} }
  /* 漢字ノート（印刷） */
  .psheet .krows{margin-top:4mm}
  .psheet .krow{display:grid; grid-template-columns:19mm 1fr repeat(4, 19mm); gap:2.5mm; align-items:center; padding:1.6mm 0; border-bottom:.6pt solid #e7e1d3}
  .psheet .ksqp{width:19mm; height:19mm; border:.9pt solid #9c9587; display:flex; align-items:center; justify-content:center; font-family:'Klee One','Klee','Hiragino Mincho ProN',serif; font-size:14mm; line-height:1; font-weight:600; color:#23211d;
    background-image:linear-gradient(#e7e1d3 1px, transparent 1px), linear-gradient(90deg, #e7e1d3 1px, transparent 1px); background-size:50% 50%; background-position:-1px -1px}
  .psheet .ksqp.faint{color:#d5cfc0}
  .psheet .kinfo b{display:block; font-family:var(--f-round); font-size:9pt; color:#23211d}
  .psheet .kinfo span{display:block; font-size:8pt; color:#6f695d; line-height:1.5}

  /* ---------- scan ---------- */
  .keyrow{display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:10px}
  .keyrow input{flex:1; min-width:200px; height:46px; border:1.5px solid var(--field-line); border-radius:8px; padding:0 10px; background:var(--field); color:var(--ink); font-size:15px}
  .mask-wrap{position:relative; margin:10px 0; border-radius:8px; overflow:hidden; background:#111}
  .mask-cv{display:block; width:100%; height:auto; touch-action:none; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none}
  .spin{display:inline-block; width:18px; height:18px; border:3px solid var(--rule); border-top-color:var(--shu); border-radius:50%; animation:spin 1s linear infinite; vertical-align:middle; margin-right:8px}
  @keyframes spin{to{transform:rotate(360deg)}}
  .prow{display:grid; grid-template-columns:34px 1fr; gap:4px 10px; padding:12px 0; border-bottom:1px solid var(--rule-soft); align-items:start}
  .prow .pn{font-family:var(--f-round); font-weight:700; color:var(--shu-ink); font-size:17px; padding-top:8px}
  .prow select{width:100%; min-height:46px; font:inherit; font-size:15px; border:1.5px solid var(--field-line); border-radius:8px; background:var(--field); color:var(--ink); padding:0 8px}
  .prow .sm{font-size:13px; color:var(--ink-soft); line-height:1.6}
  .prow .res{display:flex; gap:6px; margin-top:6px; align-items:center; flex-wrap:wrap}
  .prow .res .tool{min-width:52px}
  .prow .res .o[aria-pressed="true"]{background:var(--ok-ink); border-color:var(--ok-ink); color:#fff}
  .prow .res .x[aria-pressed="true"]{background:var(--shu); border-color:var(--shu); color:#fff}
  .prow .res .q[aria-pressed="true"]{background:var(--ink-soft); border-color:var(--ink-soft); color:#fff}
  .ttl-in{width:100%; height:48px; font:inherit; font-size:16px; border:1.5px solid var(--field-line); border-radius:8px; padding:0 10px; background:var(--field); color:var(--ink)}
  .conf-low{color:var(--shu-ink); font-size:12px; font-weight:700; margin-left:6px}
  .steps{display:flex; gap:6px; margin:14px 0 4px; font-size:12px; color:var(--ink-faint)}
  .steps b{color:var(--shu-ink)}

  @page{size:A4; margin:13mm 15mm 12mm}
  @media print{
    body{background:#fff; padding:0}
    body.print-mode .top, body.print-mode .bar, body.print-mode .pctl, body.print-mode .pdfs, body.print-mode .note{display:none !important}
    body.print-mode #main > *:not(#v-print){display:none !important}
    body.print-mode #v-print > .wrap{display:none !important}
    #printArea{zoom:1 !important; width:auto; margin:0}
    .psheet{width:auto; min-height:0; padding:0; margin:0; box-shadow:none; break-after:page; page-break-after:always}
    .psheet:last-child{break-after:auto; page-break-after:auto}
    .psheet .p{break-inside:avoid; page-break-inside:avoid}
  }

  /* きょうの クエスト */
  .qcard{margin:6px 0 10px; padding:12px 14px 10px; border-radius:16px; background:var(--paper); border:1.5px solid var(--rule)}
  .qhead{display:flex; align-items:center; gap:10px}
  .qhead .char{width:60px; height:60px; flex:none}
  .qhead .say{flex:1; min-width:0; font-family:var(--f-round); font-size:15px; line-height:1.5}
  .qhead .say small{display:block; font-family:var(--f-kaku); font-size:12px; color:var(--ink-soft); margin-top:2px}
  .ohayo{min-height:48px; padding:6px 20px; border-radius:999px; background:var(--shu); color:#fff; border:0; font-family:var(--f-round); font-size:17px; font-weight:700; flex:none; box-shadow:0 3px 0 var(--shu-ink)}
  .ohayo:active{transform:translateY(2px); box-shadow:none}
  .omikuji{display:flex; gap:6px 14px; align-items:center; flex-wrap:wrap; margin:10px 0 2px; padding:8px 12px; border-radius:12px; background:var(--shu-wash); font-family:var(--f-round); font-size:14px}
  .omikuji b.luck{font-size:24px; color:var(--shu-ink); margin-left:4px}
  .omikuji .dot{display:inline-block; width:14px; height:14px; border-radius:50%; vertical-align:-2px; margin-right:4px; border:1px solid rgba(0,0,0,.15)}
  .omikuji .fl{width:100%; color:var(--ink-soft); font-size:13px}
  .qtitle{display:flex; justify-content:space-between; align-items:baseline; font-family:var(--f-round); font-size:16px; font-weight:700; margin:10px 0 2px}
  .qtitle small{font-family:var(--f-kaku); font-weight:500; font-size:12px; color:var(--ink-soft)}
  .qlist{list-style:none; margin:0; padding:0}
  .qlist li{display:flex; align-items:center; gap:10px; padding:6px 0; border-bottom:1px dashed var(--rule-soft)}
  .qchk{width:46px; height:46px; border-radius:12px; border:2.5px solid var(--field-line); background:var(--field); font-size:24px; font-weight:700; color:#fff; display:flex; align-items:center; justify-content:center; padding:0; flex:none; transition:transform .12s}
  .qchk.on{background:var(--shu); border-color:var(--shu)}
  .qchk:active{transform:scale(.92)}
  .qtxt{flex:1; min-width:0; font-family:var(--f-round); font-size:16px; line-height:1.4}
  .qtxt small{display:block; font-family:var(--f-kaku); font-size:11.5px; color:var(--ink-soft)}
  .qok{min-height:34px; padding:2px 10px; border-radius:999px; border:1.5px solid var(--rule); background:var(--paper); font-size:12px; font-family:var(--f-round); color:var(--ink-soft); flex:none}
  .qok.on{border-color:var(--ok-ink); color:var(--ok-ink); background:var(--ok-wash)}
  .qbig{margin-top:10px; padding:8px 12px; border-radius:12px; background:var(--ok-wash); font-family:var(--f-round); font-size:14px; line-height:1.5}
  .qbig b{color:var(--ok-ink)}
  .qbig small{display:block; font-family:var(--f-kaku); font-size:12px; color:var(--ink-soft)}
  .qfoot{display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; margin-top:10px; font-family:var(--f-round); font-size:13px; color:var(--ink-soft)}
  .moods{display:flex; gap:8px}
  .moods button{width:46px; height:46px; border-radius:50%; font-size:24px; border:2px solid var(--rule); background:var(--field); padding:0; display:flex; align-items:center; justify-content:center}
  .moods button[aria-pressed="true"]{border-color:var(--shu); background:var(--shu-wash); transform:scale(1.1)}
  .qmodal{position:fixed; inset:0; z-index:50; background:rgba(0,0,0,.45); display:flex; align-items:center; justify-content:center; padding:20px}
  .qmodal .box{background:var(--ground); border-radius:18px; padding:16px 16px 14px; max-width:540px; width:100%; max-height:90vh; overflow:auto; display:flex; flex-direction:column; align-items:center; gap:6px}
  .qmodal .box .gres{width:100%}
  .qstat{font-size:13px; color:var(--ink-soft); margin:2px 0 8px}

  /* 立ち上げの 声かけ */
  .wel{position:relative; margin:14px 0 2px; padding:12px 14px; border-radius:18px; background:linear-gradient(135deg, var(--shu-wash), var(--paper)); border:1.5px solid var(--shu); animation:welin .45s ease}
  @keyframes welin{from{opacity:0; transform:translateY(-10px)} to{opacity:1; transform:none}}
  .welbody{display:flex; align-items:center; gap:12px; width:100%; background:none; border:0; padding:0 22px 0 0; text-align:left; color:var(--ink)}
  .wel .char{width:78px; height:78px; flex:none; animation:welbob 2.4s ease-in-out infinite}
  @keyframes welbob{0%,100%{transform:translateY(0)} 50%{transform:translateY(-5px)}}
  .weltxt{flex:1; min-width:0}
  .welmain{font-family:var(--f-round); font-size:17px; font-weight:700; line-height:1.45}
  .welsub{font-size:13px; color:var(--ink-soft); line-height:1.5; margin-top:3px}
  .welhint{font-size:11.5px; color:var(--ink-faint); margin-top:4px}
  .wel.pop .welmain, .wel.pop .welsub{animation:welpop .3s ease}
  @keyframes welpop{from{opacity:0; transform:scale(.97)} to{opacity:1; transform:none}}
  .welx{position:absolute; top:4px; right:6px; background:none; border:0; font-size:15px; line-height:1; color:var(--ink-faint); padding:8px 9px}
  @media (max-width:430px){
    .qhead{flex-wrap:wrap}
    .qhead .ohayo{width:100%; margin-top:2px}
    .welbody{gap:10px}
    .wel .char{width:64px; height:64px}
  }

  /* クエストを えらぶ・親の設定 */
  .qpick{margin:8px 0 2px; padding:10px 10px 12px; border-radius:14px; background:var(--ok-wash); border:1.5px dashed var(--ok-ink)}
  .qpickhd{font-family:var(--f-round); font-size:15.5px; font-weight:700}
  .qpickhd small{font-family:var(--f-kaku); font-weight:500; font-size:12px; color:var(--ink-soft); margin-left:6px}
  .qpickgrid{display:grid; grid-template-columns:repeat(auto-fill, minmax(142px,1fr)); gap:8px; margin-top:8px}
  .pk{display:flex; align-items:center; gap:8px; min-height:54px; padding:8px 10px; border:2px solid var(--rule); border-radius:12px; background:var(--paper); font-family:var(--f-round); font-size:14px; line-height:1.35; color:var(--ink); text-align:left}
  .pk[aria-pressed="true"]{border-color:var(--shu); background:var(--shu-wash)}
  .pk .pkic{font-size:21px; flex:none}
  .qpickft{display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-top:10px}
  .grph{display:flex; justify-content:space-between; align-items:center; gap:10px; width:100%; padding:11px 2px 9px; background:none; border:0; border-top:1px solid var(--rule-soft); font-family:var(--f-round); font-size:16px; font-weight:700; color:var(--ink); text-align:left}
  .grph small{font-family:var(--f-kaku); font-weight:500; font-size:12px; color:var(--ink-soft); flex:none}

  /* けいさん 1まい・学校の しんど */
  .pad-area.calc{height:200px}
  .q.calc .q-t{font-family:var(--f-round); font-size:30px; font-weight:700; letter-spacing:.02em}
  @media (max-width:560px){ .q.calc .q-t{font-size:26px} }
  .pad-guide.cg{padding:8px 10px}
  .pad-guide.cg .g-right{flex:1 1 auto}
  .kaigrid{display:grid; grid-template-columns:repeat(auto-fill, minmax(56px,1fr)); gap:6px; margin:10px 0 4px}
  .kai{min-height:46px; padding:2px; border:1.5px solid var(--rule); border-radius:10px; background:var(--paper); font-family:var(--f-round); font-size:14px; color:var(--ink); display:flex; flex-direction:column; align-items:center; justify-content:center; line-height:1.2}
  .kai small{font-size:10px; color:var(--ink-faint)}
  .kai.done{background:var(--ok-wash); border-color:var(--ok-ink); color:var(--ok-ink)}
  .kai.done small{color:var(--ok-ink)}
  .kai.now{border-color:var(--shu); border-width:2.5px; font-weight:700}
  .klearn{display:flex; flex-wrap:wrap; gap:6px; margin:6px 0 8px}
  .kl{min-width:46px; min-height:46px; padding:0; border:1.5px solid var(--rule); border-radius:10px; background:var(--field); color:var(--ink); font-family:'Klee One','Hiragino Mincho ProN',serif; font-size:22px}
  .kl[aria-pressed="true"]{background:var(--shu-wash); border-color:var(--shu); color:var(--shu-ink); font-weight:600}
  .termrow{margin:0 0 10px}
  .termrow .tlbl{display:block; font-family:var(--f-round); font-size:12.5px; font-weight:700; color:var(--ink-soft); margin:0 0 4px}
  .termrow .tabs{margin:0}
  .schoolnow{font-family:var(--f-round); font-size:14px; color:var(--ink-soft); margin:2px 0 8px}
  .schoolnow b{color:var(--shu-ink)}

  /* つぎの ごほうび・ほし */
  .nextrw{font-family:var(--f-round); font-size:13px; color:var(--ink-soft); margin-top:3px}
  .nextrw b{color:var(--shu-ink)}
  .stars{font-size:20px; letter-spacing:2px; line-height:1.4; color:#e6a100}
  .trow .pill.up{background:var(--shu-wash); color:var(--shu-ink); border-color:var(--shu)}
  .stars small{display:block; font-family:var(--f-kaku); font-size:12px; color:var(--ink-soft); letter-spacing:0}

  /* カレンダー */
  .calhd{display:flex; align-items:center; justify-content:space-between; gap:8px; margin:10px 0 8px}
  .calhd b{font-family:var(--f-round); font-size:19px; font-weight:700}
  .calnav{min-width:48px; min-height:44px; border:1.5px solid var(--rule); border-radius:10px; background:var(--paper); color:var(--ink); font-size:18px}
  .calgrid{display:grid; grid-template-columns:repeat(7,1fr); gap:4px}
  .cwd{text-align:center; font-family:var(--f-round); font-size:11.5px; color:var(--ink-soft); padding:2px 0}
  .cwd.sat{color:#4d8fd6} .cwd.sun{color:var(--shu-ink)}
  .cday{min-height:58px; padding:3px 2px; border:1.5px solid var(--rule); border-radius:10px; background:var(--paper); color:var(--ink); display:flex; flex-direction:column; align-items:center; gap:2px}
  .cday b{font-family:var(--f-round); font-size:13px; font-weight:700; line-height:1.1}
  .cday.out{opacity:.3}
  .cday.today{border-color:var(--shu); border-width:2.5px}
  .cday.sel{background:var(--shu-wash); border-color:var(--shu)}
  .cday .st{width:15px; height:15px; border-radius:50%; background:var(--shu); display:block}
  .cday .dots{font-size:9px; color:var(--ok-ink); line-height:1; letter-spacing:1px}
  .cday .pm{font-size:12px; line-height:1.1}
  @media (max-width:560px){ .cday{min-height:52px; gap:1px} .cday b{font-size:12px} .cday .st{width:12px; height:12px} .calgrid{gap:3px} }
  .calsum{font-family:var(--f-round); font-size:14px; color:var(--ink-soft); margin:10px 0 2px}
  .calsum b{color:var(--ink)}
  .dlist{list-style:none; margin:6px 0 0; padding:0}
  .dlist li{display:flex; align-items:center; gap:8px; padding:5px 0; border-bottom:1px dashed var(--rule-soft); font-size:14px}
  .dlist li b{font-family:var(--f-round)}
  .dlist .del{margin-left:auto; min-height:34px; padding:2px 10px; border-radius:999px; border:1.5px solid var(--rule); background:var(--paper); color:var(--shu-ink); font-size:12px}
  .pcard{margin:8px 0 2px; padding:8px 12px; border-radius:14px; background:var(--shu-wash); border:1.5px solid var(--shu)}
  .prow{display:flex; align-items:center; gap:10px; width:100%; background:none; border:0; padding:6px 2px; text-align:left; color:var(--ink)}
  .prow b{font-family:var(--f-round); font-size:17px; color:var(--shu-ink); flex:none; min-width:74px}
  .prow .ptx{font-family:var(--f-round); font-size:15px; flex:1; min-width:0}
  .prow .ptx small{display:block; font-family:var(--f-kaku); font-size:12px; color:var(--ink-soft)}

  /* なおし（まちがえた もんだいだけ） */
  .fixhd{display:flex; align-items:center; gap:10px; margin:6px 0 10px; padding:10px 14px; border-radius:14px; background:var(--shu-wash); border:1.5px solid var(--shu)}
  .fixhd b{font-family:var(--f-round); font-size:17px; font-weight:700; color:var(--shu-ink)}
  .fixhd span{font-size:13px; color:var(--ink-soft); line-height:1.5}
  .score.fix .big{color:var(--shu-ink)}

  /* ホームの グループ・つかいかた */
  .hsec{display:flex; align-items:center; gap:8px; margin:20px 0 9px}
  .hsec b{font-family:var(--f-round); font-size:15.5px; font-weight:700; color:var(--ink)}
  .hsec i{width:22px; height:22px; border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:13px; font-style:normal; flex:none}
  .hsec s{flex:1; height:1.5px; background:var(--rule-soft); text-decoration:none}
  .g1 .hsec i{background:var(--a1w); color:var(--a1)} .g2 .hsec i{background:var(--a2w); color:var(--a2)} .g3 .hsec i{background:var(--a3w); color:var(--a3)}
  .tile{box-shadow:0 2px 0 var(--rule-soft)}
  .tile .ic{width:46px; height:46px; border-radius:15px; display:flex; align-items:center; justify-content:center; flex:none}
  .tile .tt{display:flex; flex-direction:column; gap:3px; min-width:0; width:100%}
  .tile .ic svg{width:26px; height:26px}
  .g1 .tile .ic{background:var(--a1w)} .g1 .tile .ic svg{color:var(--a1)}
  .g2 .tile .ic{background:var(--a2w)} .g2 .tile .ic svg{color:var(--a2)}
  .g3 .tile .ic{background:var(--a3w)} .g3 .tile .ic svg{color:var(--a3)}
  .g1 .tile{background:linear-gradient(180deg, var(--a1w), var(--paper) 62%)}
  .g2 .tile{background:linear-gradient(180deg, var(--a2w), var(--paper) 62%)}
  .tiles.mini{grid-template-columns:repeat(auto-fit, minmax(158px, 1fr)); gap:8px}
  .tiles.mini .tile{flex-direction:row; align-items:center; gap:10px; min-height:60px; padding:9px 12px; box-shadow:none}
  .tiles.mini .tile .ic{width:36px; height:36px; border-radius:12px}
  .tiles.mini .tile .ic svg{width:21px; height:21px}
  .tiles.mini .tile b{font-size:15.5px}
  .tiles.mini .tile .tt span{display:none}
  .tiles.mini .tile .tt{gap:0}
  .helpb{margin-left:auto; width:40px; height:40px; border-radius:50%; border:1.5px solid currentColor; background:transparent; color:var(--bar-ink); font-family:var(--f-round); font-size:17px; font-weight:700; opacity:.85; flex:none}
  .hq{border:1.5px solid var(--rule); border-radius:14px; background:var(--paper); margin:8px 0; overflow:hidden}
  .hq>summary{list-style:none; cursor:pointer; display:flex; align-items:center; gap:10px; padding:13px 14px; font-family:var(--f-round); font-size:16.5px; font-weight:700}
  .hq>summary::-webkit-details-marker{display:none}
  .hq>summary::after{content:'＋'; margin-left:auto; color:var(--ink-faint); font-size:16px}
  .hq[open]>summary::after{content:'−'}
  .hq[open]>summary{border-bottom:1px dashed var(--rule-soft)}
  .hq .em{width:32px; height:32px; border-radius:11px; background:var(--a1w); display:flex; align-items:center; justify-content:center; font-size:17px; flex:none}
  .hbody{padding:10px 15px 14px; font-size:14.5px; line-height:1.85; color:var(--ink)}
  .hbody p{margin:0 0 8px}
  .hbody ol, .hbody ul{margin:0 0 8px; padding-left:1.3em}
  .hbody li{margin:3px 0}
  .hbody b{color:var(--shu-ink)}
  .hbody .k{display:inline-block; font-family:var(--f-round); font-size:13px; background:var(--rule-soft); border-radius:8px; padding:1px 8px; margin:0 1px}
  .hnote{font-family:var(--f-round); font-size:14px; color:var(--ink-soft); margin:4px 0 14px; line-height:1.7}

  /* ドリまるの うごき（へや） */
  .room .dori{transform-box:fill-box; transform-origin:50% 92%}
  .room .dori.study{animation:dstudy 2.8s ease-in-out infinite}
  .room .dori.rest{animation:drest 4.2s ease-in-out infinite}
  .room .dori.sleep{animation:dsleep 4.6s ease-in-out infinite}
  @keyframes dstudy{0%,100%{transform:translateY(0) rotate(0deg)} 22%{transform:translateY(1.6px) rotate(-2.2deg)} 55%{transform:translateY(-.5px) rotate(1.6deg)} 78%{transform:translateY(1.2px) rotate(-1deg)}}
  @keyframes drest{0%,100%{transform:translateY(0) rotate(-1deg)} 50%{transform:translateY(-3.5px) rotate(1deg)}}
  @keyframes dsleep{0%,100%{transform:translateY(0) rotate(-4deg)} 50%{transform:translateY(2.5px) rotate(-4deg)}}
  .room .pencil{transform-box:fill-box; transform-origin:50% 100%; animation:dpen 1.4s ease-in-out infinite}
  @keyframes dpen{0%,100%{transform:translateX(0) rotate(-10deg)} 50%{transform:translateX(11px) rotate(-1deg)}}
  .room .steam{animation:dsteam 3s ease-in-out infinite}
  .room .steam2{animation:dsteam 3s ease-in-out .9s infinite}
  @keyframes dsteam{0%{opacity:0; transform:translateY(2px)} 35%{opacity:.85} 100%{opacity:0; transform:translateY(-13px)}}
  .room .zzz{animation:dzzz 3.4s ease-in-out infinite}
  .room .zzz2{animation:dzzz 3.4s ease-in-out 1.2s infinite}
  @keyframes dzzz{0%{opacity:0; transform:translate(0,0) scale(.6)} 30%{opacity:.9} 100%{opacity:0; transform:translate(10px,-20px) scale(1.1)}}
  .eye{transform-box:fill-box; transform-origin:center; animation:dblink 5.6s infinite}
  .gbig .char{animation:dbreath 3.6s ease-in-out infinite}
  @keyframes dblink{0%,91%,100%{transform:scaleY(1)} 94.5%{transform:scaleY(.12)}}
  @keyframes dbreath{0%,100%{transform:translateY(0) scale(1)} 50%{transform:translateY(-4px) scale(1.015)}}
  @media (prefers-reduced-motion: reduce){ *{animation:none !important; transition:none !important} }
  /* ---------- forms: つくる・はじめに・答えの種類 ---------- */
  .fm{display:block; margin:10px 0}
  .fm .fl{display:block; font-size:13px; color:var(--ink-soft); margin-bottom:4px}
  .fm .fh{display:block; font-size:12px; color:var(--ink-faint); margin-top:4px}
  input.txt, textarea.txt{width:100%; font:inherit; font-size:16px; padding:8px 10px; border:1.5px solid var(--rule); border-radius:10px; background:var(--field); color:var(--ink)}
  textarea.txt{resize:vertical}
  .seg{display:flex; flex-wrap:wrap; gap:6px}
  .vrow{display:flex; flex-wrap:wrap; align-items:center; gap:6px; padding:8px; border:1px dashed var(--rule); border-radius:10px; margin-bottom:6px}
  .vrow input.vnum{width:76px; text-align:center} .vrow input.vn{width:56px; text-align:center; font-weight:700} .vrow .vl{color:var(--ink-faint)}
  .vrow input.vlist{width:100%}
  .prev{margin:8px 0}
  .pv{display:flex; justify-content:space-between; gap:10px; padding:6px 0; border-bottom:1px solid var(--rule-soft); font-size:14px}
  .pv b.a{white-space:nowrap; color:var(--shu-ink)}
  .muted.shu{color:var(--shu-ink)}
  .grades{display:grid; grid-template-columns:repeat(auto-fill, minmax(92px,1fr)); gap:8px}
  .gbtn{display:flex; flex-direction:column; align-items:center; padding:10px 6px; border:1.5px solid var(--rule); border-radius:12px; background:var(--paper); color:var(--ink)}
  .gbtn b{font-family:var(--f-round); font-size:18px} .gbtn small{font-size:11px; color:var(--ink-soft)}
  .gbtn[aria-pressed="true"]{background:var(--shu); border-color:var(--shu); color:#fff} .gbtn[aria-pressed="true"] small{color:rgba(255,255,255,.85)}
  .num.txt{width:min(260px, 100%); text-align:left; font-family:var(--f-kaku); font-size:20px}
  .opt.sign{min-width:48px; font-size:24px; padding:4px 10px}
  .frac{display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle}
  .frac .num{height:44px; width:72px}
  .frac i{display:block; width:100%; height:2px; background:var(--ink); margin:2px 0}
  .num.sm{width:64px}
  .unit.pre{font-family:var(--f-round); font-size:22px; font-weight:700; color:var(--ink)}
  .keys{display:flex; flex-wrap:wrap; gap:6px; width:100%; margin-top:6px}
  .key{min-width:42px; min-height:40px; padding:4px 10px; font-family:var(--f-round); font-size:18px; border:1.5px solid var(--rule); border-radius:8px; background:var(--field); color:var(--ink)}
  .ccard.plain{flex-direction:column; align-items:stretch; gap:6px}
  .stp .muted{margin-right:auto}
</style>
</head>
<body>

<div class="top"><div class="wrap">

</div></div>

<main id="main">

  <section id="v-home">
    <div class="wrap">
      <div id="charCard"></div>
      <p class="hello" id="hello"></p>
      <div id="tiles"></div>
      <p class="note" id="homeNote"></p>

  <section id="v-grow" hidden>

<script>
(function () {
  var DATA = { tests: [] };            // 固定の テストは なし。テストの ページは 利用者が 作る
  var PAGES_PRESET = [];
  // 学年の パック（packs/）と じぶんで つくった もんだい から applyPack() が 組み立てる
  var TYPES = {}, LESSONS = {}, UNITS = [], TYPE_ORDER = [], SCHOOL = [], DEFAULT_WEAK = [], HINTS = {}, PACK_MATH = null;
  var CGEN = {}, COURSE = [], KAI_MAX = 0, PACK_CALC = null;
  var KANJI = [], KMAP = {}, KALL = [], PACK_KANJI = null;
  var MARKS = ['①', '②', '③', '④', '⑤', '⑥', '⑦', '⑧', '⑨', '⑩'];

    p.appendChild(el('h3', null, setupMode === 'add' ? 'ほかの 子どもを 登録する' : 'はじめまして！'));
    p.appendChild(el('p', 'muted', setupMode === 'add' ? 'なまえと 学年を 入れて ください。きろくは 子どもごとに 分かれます。' : 'つかう 子どもの なまえ（ニックネーム）と 学年を 入れて ください。あとから「せってい」で かえられます。'));
    var name = txt('', 'なまえ（ニックネーム）'); name.maxLength = 10; p.appendChild(fld('なまえ', name));
    var gsel = null, gg = el('div', 'grades');
    PACKS.grades.forEach(function (gr) {
      var b = btn('gbtn', null, function () { gsel = gr.id; Array.prototype.forEach.call(gg.children, function (c) { c.setAttribute('aria-pressed', String(c === b)); }); });
      b.appendChild(el('b', null, gr.short)); b.appendChild(el('small', null, PACKS.has(gr.id, 'math') ? '型 あり' : 'じぶんで 作る')); b.setAttribute('aria-pressed', 'false'); gg.appendChild(b);
    });
    p.appendChild(fld('学年', gg, '「型 あり」は 運営が 用意した もんだいが 入って います。ほかの 学年も「じぶんで つくる」で 使えます。'));
    p.appendChild(btn('btn', 'はじめる', function () {
      var v = name.value.trim(); if (!v) { alert('なまえを 入れて ください。'); return; } if (!gsel) { alert('学年を えらんで ください。'); return; }
      addProfile(v.slice(0, 10), gsel); location.reload();
    }));
    if (setupMode === 'add') p.appendChild(btn('linkbtn', 'やめる', function () { renderGrow(); show('grow'); }));
    box.appendChild(p);
    if (setupMode !== 'add') {
      var ip = el('div', 'panel'); ip.appendChild(el('h3', null, 'このアプリで できること'));
      ip.appendChild(html('ul', 'muted', '<li>学年を えらぶと、その学年の もんだい（型）が 出ます。</li><li>iPadの ペンで 書いて、自動で まるつけ。まちがえた 問題は なおすまで つぎに 進みません。</li><li>おうちの人が <b>じぶんで もんだいを 作れます</b>（カード／数字が 毎回 かわる 穴あき問題）。</li><li>テストの けっかを 入れると、まちがえた 型を 多めに 入れた プリントが できます。</li><li>ポイント・レベル・クエストで まいにち つづく しかけ。記録は この 端末の 中だけに あります。</li>'));
      box.appendChild(ip);
    }
  }

  // ---------- じぶんで つくる（おうちの人向け・学年ごと） ----------
  var mst = { unit: null, edit: null };
  function unitByCid(id) { for (var i = 0; i < content.units.length; i++) if (content.units[i].id === id) return content.units[i]; return null; }
  function fld(label, input, hint) { var w = el('div', 'fm'); w.appendChild(el('span', 'fl', label)); w.appendChild(input); if (hint) w.appendChild(el('small', 'fh', hint)); return w; }
  function txt(v, ph) { var i = el('input', 'txt'); i.type = 'text'; i.value = v == null ? '' : v; i.placeholder = ph || ''; i.autocomplete = 'off'; return i; }
  function area(v, ph, rows) { var t = el('textarea', 'txt'); t.value = v || ''; t.placeholder = ph || ''; t.rows = rows || 3; return t; }
  function seg(opts, val, onchange) {
    var box = el('div', 'seg');
    opts.forEach(function (o) {
      var b = btn('tool', o[1], function () { Array.prototype.forEach.call(box.children, function (c) { c.setAttribute('aria-pressed', 'false'); }); b.setAttribute('aria-pressed', 'true'); box.value = o[0]; if (onchange) onchange(o[0]); });
      b.setAttribute('aria-pressed', String(o[0] === val)); box.appendChild(b);
    });
    box.value = val; return box;
  }
  function contentChanged() { saveContent(); applyPack(); }
  function renderMake() {
    var box = $('make'); box.innerHTML = ''; cur = null; $('bar').hidden = true;
    var u = mst.unit ? unitByCid(mst.unit) : null;
    if (u) return renderUnitEditor(box, u);
    var p = el('div', 'panel');
    p.appendChild(el('h3', null, gradeInfo().name + 'の もんだいを つくる'));
    p.appendChild(html('p', 'muted', '<b>おうちの人</b>が つくる ところです。作った ものは「' + T('daily') + '」「' + T('weak') + '」「' + T('scan') + '」「' + T('print') + '」で 使えます。学年ごとに 分かれて いて、子どもを きりかえても 同じ 学年なら 共通です。'));
    var list = customUnits();
    if (list.length) {
      var ll = el('div', 'llist');
      list.forEach(function (cu, i) {
        var row = btn('lrow', null, function () { mst.unit = cu.id; mst.edit = null; renderMake(); });
        row.appendChild(el('span', 'n', String(i + 1)));
        row.appendChild(el('span', null, cu.name));
        row.appendChild(el('span', 'st', (cu.kind === 'card' ? 'カード ' : '穴あき ') + (cu.items || []).length + '問'));
        ll.appendChild(row);
      });
      p.appendChild(ll);
    } else p.appendChild(el('p', 'muted', 'まだ ありません。下から カテゴリーを 作りましょう。'));
    box.appendChild(p);
    var np = el('div', 'panel');
    np.appendChild(el('h3', null, '＋ カテゴリーを つくる'));
    var name = txt('', '例：英単語 Unit1／正負の数／九九');
    np.appendChild(fld('カテゴリーの 名前', name));
    var kind = seg([['tpl', '穴あき（数字が 毎回 かわる）'], ['card', 'カード（問題と 答えを 打つ）']], 'tpl');
    np.appendChild(fld('作り方', kind, '算数・数学は 穴あき、英単語・漢字・一問一答は カードが 向いています。'));
    np.appendChild(btn('btn sm', 'つくる', function () {
      var v = name.value.trim(); if (!v) { alert('名前を 入れて ください。'); return; }
      var cu = { id: uid('u'), grade: gradeId(), subject: 'math', kind: kind.value, name: v.slice(0, 20), items: [], createdAt: new Date().toISOString() };
      content.units.push(cu); contentChanged(); mst.unit = cu.id; mst.edit = 'new'; renderMake();
    }));
    box.appendChild(np);
    var ex = el('div', 'panel');
    ex.appendChild(el('h3', null, '書き出す・読み込む'));
    ex.appendChild(el('p', 'muted', 'この 学年の 作った もんだいを ファイルに して、ほかの 端末や 家族に わたせます。'));
    var ea = el('div', 'rec-actions');
    ea.appendChild(btn('linkbtn', '書き出す', exportContent));
    ea.appendChild(btn('linkbtn', '読み込む', importContent));
    ex.appendChild(ea); box.appendChild(ex);
  }
  function exportContent() {
    var units = customUnits(); if (!units.length) { alert('この 学年には まだ ありません。'); return; }
    var payload = JSON.stringify({ app: 'じぶんドリル', kind: 'content', grade: gradeId(), exportedAt: new Date().toISOString(), units: units }, null, 2);
    var name = 'jibun-drill-' + gradeId() + '-mondai-' + new Date().toISOString().slice(0, 10) + '.json';
    try { var file = new File([payload], name, { type: 'application/json' }); if (navigator.canShare && navigator.canShare({ files: [file] })) { navigator.share({ files: [file], title: 'じぶんドリル もんだい' }).catch(function () {}); return; } } catch (e) {}
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(payload).then(function () { alert('コピーしました。メモなどに はりつけて 送ってください。'); }, function () { prompt('この 内容を コピーしてください', payload); });
    else prompt('この 内容を コピーしてください', payload);
  }
  function importContent() {
    var t = prompt('書き出した もんだい（JSON）を はりつけて ください。同じ IDの ものは 上書きされます。'); if (!t) return;
    try {
      var o = JSON.parse(t), units = o.units; if (!units || !units.length) throw new Error('form');
      var n = 0; units.forEach(function (cu) { if (!cu.id || !cu.name || !cu.kind) return; var ex = unitByCid(cu.id); if (ex) content.units[content.units.indexOf(ex)] = cu; else content.units.push(cu); n++; });
      contentChanged(); renderMake(); alert(n + 'の カテゴリーを 読み込みました。');
    } catch (e) { alert('読み込めませんでした。書き出した ままの 内容を はりつけて ください。'); }
  }
  function renderUnitEditor(box, u) {
    var p = el('div', 'panel');
    var hd = el('div', 'stp'); hd.appendChild(el('b', null, u.name)); hd.appendChild(el('span', 'muted', u.kind === 'card' ? 'カード' : '穴あき'));
    hd.appendChild(btn('tool', '名前を かえる', function () { var v = prompt('カテゴリーの 名前', u.name); if (v && v.trim()) { u.name = v.trim().slice(0, 20); contentChanged(); renderMake(); } }));
    hd.appendChild(btn('tool', 'けす', function () { if (!confirm('「' + u.name + '」と 中の もんだいを けします。よろしいですか？')) return; content.units = content.units.filter(function (x) { return x !== u; }); contentChanged(); mst.unit = null; renderMake(); }));
    p.appendChild(hd);
    var acts = el('div', 'actions');
    acts.appendChild(btn('btn sm ghost', '← 一らんへ', function () { mst.unit = null; mst.edit = null; renderMake(); }));
    if ((u.items || []).length) acts.appendChild(btn('btn sm', 'この カテゴリーで 5問 ためす', function () { dst.unit = 'u_' + u.id; startDaily('u_' + u.id); }));
    p.appendChild(acts);
    box.appendChild(p);
    var lp = el('div', 'panel');
    lp.appendChild(el('h3', null, 'もんだい　' + (u.items || []).length + '問'));
    var ll = el('div', 'llist');
    (u.items || []).forEach(function (it, i) {
      var row = btn('lrow', null, function () { mst.edit = it.id; renderMake(); });
      row.appendChild(el('span', 'n', String(i + 1)));
      row.appendChild(el('span', null, u.kind === 'card' ? it.q + '　→　' + it.a : (it.name ? it.name + '　' : '') + it.text));
      row.appendChild(el('span', 'st', u.kind === 'card' ? ({ choice: '4たく', input: '入力', self: '手書き' })[it.mode || 'choice'] || '' : (it.kind === 'dec' ? '小数' : it.kind === 'int' ? '整数±' : '')));
      ll.appendChild(row);
    });
    lp.appendChild(ll);
    if (mst.edit !== 'new') lp.appendChild(btn('btn sm', '＋ もんだいを 足す', function () { mst.edit = 'new'; renderMake(); }));
    box.appendChild(lp);
    if (mst.edit) {
      var it = mst.edit === 'new' ? null : (u.items || []).filter(function (x) { return x.id === mst.edit; })[0];
      if (mst.edit === 'new' || it) box.appendChild(u.kind === 'card' ? cardForm(u, it) : tplForm(u, it));
    }
    if (u.kind === 'card') box.appendChild(bulkForm(u));
  }
  function cardForm(u, it) {
    var p = el('div', 'panel'); p.appendChild(el('h3', null, it ? 'カードを 直す' : 'カードを 足す'));
    var q = area(it ? it.q : '', '例：apple　／　「きょう」を 漢字で　／　日本で いちばん 高い 山は？', 2), a = txt(it ? it.a : '', '例：りんご　／　今日　／　富士山');
    var opts = txt(it && it.opts ? it.opts.join('｜') : '', '例：みかん｜ぶどう｜もも（なければ ほかの カードの 答えから 自動で 作る）'), note = txt(it ? it.note || '' : '', 'まちがえた ときに 見せる ひとこと');
    var mode = seg([['choice', '4たく'], ['input', '入力'], ['self', '手書きで じぶんで ○✗']], it ? it.mode || 'choice' : 'choice');
    p.appendChild(fld('問題', q)); p.appendChild(fld('答え', a)); p.appendChild(fld('答え方', mode, '入力は 文字や 数（大小・空白は 気にしない）。手書きは 漢字や 記述に。'));
    p.appendChild(fld('えらぶ 候補（4たくの とき）', opts, '「｜」か「,」で 区切る')); p.appendChild(fld('かいせつ', note));
    var acts = el('div', 'actions');
    acts.appendChild(btn('btn sm', it ? 'ほぞん' : '足す', function () {
      var qv = q.value.trim(), av = a.value.trim(); if (!qv || !av) { alert('問題と 答えを 入れて ください。'); return; }
      var ov = opts.value.split(/[｜|,、，]/).map(function (s) { return s.trim(); }).filter(Boolean);
      var obj = it || { id: uid('c') }; obj.q = qv.slice(0, 200); obj.a = av.slice(0, 40); obj.opts = ov.slice(0, 5); obj.note = note.value.trim().slice(0, 120); obj.mode = mode.value;
      if (!it) (u.items = u.items || []).push(obj);
      contentChanged(); mst.edit = null; renderMake();
    }));
    if (it) acts.appendChild(btn('btn sm ghost', 'この カードを けす', function () { u.items = u.items.filter(function (x) { return x !== it; }); contentChanged(); mst.edit = null; renderMake(); }));
    acts.appendChild(btn('linkbtn', 'やめる', function () { mst.edit = null; renderMake(); }));
    p.appendChild(acts); return p;
  }
  function bulkForm(u) {
    var p = el('div', 'panel'); p.appendChild(el('h3', null, 'まとめて 入れる（表）'));
    p.appendChild(html('p', 'muted', '1行に 1問。<b>問題, 答え, 候補1｜候補2｜候補3, かいせつ</b> の 順（答えより 後ろは なくても OK）。表計算から コピーした タブ区切りでも 読めます。'));
    var ta = area('', 'apple, りんご, みかん｜ぶどう｜もも\ncat, ねこ\n「きょう」を 漢字で, 今日', 5);
    var mode = seg([['choice', '4たく'], ['input', '入力'], ['self', '手書きで じぶんで ○✗']], 'choice');
    p.appendChild(ta); p.appendChild(fld('答え方（まとめて）', mode));
    p.appendChild(btn('btn sm', '読み込んで 足す', function () {
      var n = 0; ta.value.split(/\r?\n/).forEach(function (line) {
        if (!line.trim()) return; var c = line.indexOf('\t') >= 0 ? line.split('\t') : line.split(/[,，、]/); c = c.map(function (s) { return s.trim(); });
        if (c.length < 2 || !c[0] || !c[1]) return;
        (u.items = u.items || []).push({ id: uid('c'), q: c[0].slice(0, 200), a: c[1].slice(0, 40), opts: (c[2] || '').split(/[｜|]/).map(function (s) { return s.trim(); }).filter(Boolean).slice(0, 5), note: (c[3] || '').slice(0, 120), mode: mode.value }); n++;
      });
      if (!n) { alert('読める 行が ありませんでした。'); return; }
      contentChanged(); renderMake(); alert(n + '問 足しました。');
    }));
    return p;
  }
  function tplForm(u, it) {
    var p = el('div', 'panel'); p.appendChild(el('h3', null, it ? '穴あき問題を 直す' : '穴あき問題を 足す'));
    p.appendChild(html('p', 'muted', '問題文の 数を <b>{a}</b> <b>{b}</b> の ように 書き、下で それぞれの はんいを きめます。答えは <b>a+b</b> の ように 式で。文中に <b>{a*b}</b> と 書けば 計算した 数も 出せます。'));
    var d = it || { name: '', text: '', vars: [{ n: 'a', min: 1, max: 9, step: 1 }, { n: 'b', min: 1, max: 9, step: 1 }], ans: '', unit: '', kind: 'n', cond: '', shiki: '' };
    var name = txt(d.name, '例：あわせて いくつ（型の 名前。まるつけの 後に 出る）');
    var text = area(d.text, '例：りんごが {a}こ、みかんが {b}こ あります。あわせて なんこ ありますか。', 3);
    var vbox = el('div'), vars = (d.vars || []).map(function (v) { return { n: v.n, min: v.min, max: v.max, step: v.step || 1, list: v.list ? v.list.join('｜') : '' }; });
    function drawVars() {
      vbox.innerHTML = '';
      vars.forEach(function (v, i) {
        var row = el('div', 'vrow');
        var nI = txt(v.n, 'a'); nI.classList.add('vn'); nI.addEventListener('input', function () { v.n = nI.value.replace(/[^A-Za-z_]/g, '').slice(0, 8); });
        var minI = txt(v.min, '1'); minI.classList.add('vnum'); minI.inputMode = 'decimal'; minI.addEventListener('input', function () { v.min = minI.value; });
        var maxI = txt(v.max, '9'); maxI.classList.add('vnum'); maxI.inputMode = 'decimal'; maxI.addEventListener('input', function () { v.max = maxI.value; });
        var stI = seg([['1', '整数'], ['0.1', '小数1けた'], ['0.01', '小数2けた'], ['5', '5とび'], ['10', '10とび']], String(v.step), function (s) { v.step = s; });
        var lsI = txt(v.list, 'ことばの リスト（例：りんご｜みかん）。書くと 数では なく ことばに なる'); lsI.classList.add('vlist'); lsI.addEventListener('input', function () { v.list = lsI.value; });
        row.appendChild(el('span', 'vl', '{')); row.appendChild(nI); row.appendChild(el('span', 'vl', '}　'));
        row.appendChild(minI); row.appendChild(el('span', 'vl', '〜')); row.appendChild(maxI); row.appendChild(stI);
        row.appendChild(lsI);
        row.appendChild(btn('linkbtn shu', 'けす', function () { vars.splice(i, 1); drawVars(); }));
        vbox.appendChild(row);
      });
      vbox.appendChild(btn('linkbtn', '＋ 穴を 足す', function () { vars.push({ n: 'abcdefgh'[vars.length] || 'x', min: 1, max: 9, step: 1, list: '' }); drawVars(); }));
    }
    drawVars();
    var ans = txt(d.ans, '例：a+b　／　a*b　／　abs(a-b)'), unit = txt(d.unit, '例：こ・人・cm・円（なければ 空）');
    var kind = seg([['n', '0いじょうの 整数'], ['int', '整数（マイナスも）'], ['dec', '小数']], d.kind || 'n');
    var cond = txt(d.cond, '例：a>b　／　a+b<=20（この 条件に あう 数だけ 出す）'), shiki = txt(d.shiki, '例：{a}+{b}={a+b}（空なら 答えの 式から 自動で 作る）');
    p.appendChild(fld('型の 名前', name)); p.appendChild(fld('問題文', text)); p.appendChild(fld('穴（数の はんい）', vbox));
    p.appendChild(fld('答えの 式', ans)); p.appendChild(fld('答えの 種類', kind)); p.appendChild(fld('単位', unit)); p.appendChild(fld('条件（なくて OK）', cond)); p.appendChild(fld('しきの 見せ方（なくて OK）', shiki));
    function build() {
      return { id: d.id || uid('t'), name: name.value.trim().slice(0, 24) || u.name, text: text.value.trim().slice(0, 300), ans: ans.value.trim().replace(/[{}]/g, ''), unit: unit.value.trim().slice(0, 6), kind: kind.value, cond: cond.value.trim().replace(/[{}]/g, ''), shiki: shiki.value.trim(),
        vars: vars.filter(function (v) { return v.n; }).map(function (v) { var o = { n: v.n, min: +v.min || 0, max: +v.max || 0, step: +v.step || 1 }; var ls = (v.list || '').split(/[｜|,、，]/).map(function (s) { return s.trim(); }).filter(Boolean); if (ls.length) o.list = ls; return o; }) };
    }
    var prev = el('div', 'prev');
    function preview() {
      prev.innerHTML = ''; var obj = build();
      if (!obj.text || !obj.ans) { prev.appendChild(el('p', 'muted', '問題文と 答えの 式を 入れると、見本が 出ます。')); return; }
      var gen = tplGen(obj), r = Math.random, bad = 0;
      for (var i = 0; i < 5; i++) {
        var q = gen(r), row = el('div', 'pv'); if (q.ans.k === 'self') bad++;
        row.appendChild(el('span', 'q', MARKS[i] + ' ' + q.t)); row.appendChild(el('b', 'a', q.ans.k === 'self' ? '—' : answerText(q.ans) + (q.s.length ? '　（' + q.s[0] + '）' : ''))); prev.appendChild(row);
      }
      if (bad) prev.appendChild(el('p', 'muted shu', '答えが 出せない 組み合わせが あります。はんい・式・条件を 見なおして ください。'));
    }
    p.appendChild(btn('btn sm ghost', '見本を 5問 出す', preview)); p.appendChild(prev); preview();
    var acts = el('div', 'actions');
    acts.appendChild(btn('btn sm', it ? 'ほぞん' : '足す', function () {
      var obj = build(); if (!obj.text || !obj.ans) { alert('問題文と 答えの 式を 入れて ください。'); return; }
      try { evalExpr(obj.ans, sampleVars(obj)); } catch (e) { alert('答えの 式が 読めません：' + e.message); return; }
      if (it) { for (var k in obj) it[k] = obj[k]; } else (u.items = u.items || []).push(obj);
      contentChanged(); mst.edit = null; renderMake();
    }));
    if (it) acts.appendChild(btn('btn sm ghost', 'この もんだいを けす', function () { u.items = u.items.filter(function (x) { return x !== it; }); contentChanged(); mst.edit = null; renderMake(); }));
    acts.appendChild(btn('linkbtn', 'やめる', function () { mst.edit = null; renderMake(); }));
    p.appendChild(acts); return p;
  }

  var presetAdded = applyPresetPages();
  initGame(); save();

  // ---------- boot ----------
  if (QS.gen) { renderPrint(); show('print'); document.body.classList.add('print-mode'); }
  else if (!profile()) { renderSetup(); show('setup'); }
  else { renderHome(); show('home'); }
})();
