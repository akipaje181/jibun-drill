# Supabase CLI の設定（supabase link 後に project_id を入れる）
[functions.stripe-webhook]
verify_jwt = false   # Stripe からの 呼び出しには JWT が ない（署名で 検証する）
[functions.checkout]
verify_jwt = true
[functions.portal]
verify_jwt = true

# ログイン（メール認証）の 戻り先。supabase config push で 反映する
[auth]
site_url = "https://akipaje181.github.io/jibun-drill/"
additional_redirect_urls = ["https://akipaje181.github.io/jibun-drill/", "https://akipaje181.github.io/jibun-drill/?reset=1", "http://localhost:8766/"]
